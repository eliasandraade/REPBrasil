name: Sonar main diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Print open main-branch issues and security hotspots
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --get 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=eliasandraade_REPBrasil' \
            --data-urlencode 'branch=main' \
            --data-urlencode 'statuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=100' \
            -o /tmp/issues.json

          curl --fail --silent --show-error --get 'https://sonarcloud.io/api/hotspots/search' \
            --data-urlencode 'projectKey=eliasandraade_REPBrasil' \
            --data-urlencode 'branch=main' \
            --data-urlencode 'status=TO_REVIEW' \
            --data-urlencode 'ps=100' \
            -o /tmp/hotspots.json

          python - <<'PY'
          import json
          from pathlib import Path

          issues = json.loads(Path('/tmp/issues.json').read_text())
          print(f"ISSUES total={issues.get('total')}")
          for issue in issues.get('issues', []):
              component = issue.get('component', '').split(':', 1)[-1]
              line = issue.get('line') or issue.get('textRange', {}).get('startLine')
              print('--- issue')
              print(f"severity={issue.get('severity')} type={issue.get('type')} rule={issue.get('rule')}")
              print(f"file={component} line={line}")
              print(f"message={issue.get('message')}")

          hotspots = json.loads(Path('/tmp/hotspots.json').read_text())
          paging = hotspots.get('paging', {})
          print(f"HOTSPOTS total={paging.get('total', len(hotspots.get('hotspots', [])))}")
          for hotspot in hotspots.get('hotspots', []):
              component = hotspot.get('component', '').split(':', 1)[-1]
              line = hotspot.get('line') or hotspot.get('textRange', {}).get('startLine')
              print('--- hotspot')
              print(f"key={hotspot.get('key')} rule={hotspot.get('ruleKey')} status={hotspot.get('status')}")
              print(f"file={component} line={line}")
              print(f"message={hotspot.get('message')}")
          PY
