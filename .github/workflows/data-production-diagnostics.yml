name: Data production diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/repbrasil-data-diagnostics
          cd /tmp/repbrasil-data-diagnostics
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact playwright@1.55.0
          ln -s /tmp/repbrasil-data-diagnostics/node_modules "$GITHUB_WORKSPACE/node_modules"
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect /dados hydration and requests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const requests = [];
          const failures = [];
          const consoleMessages = [];
          page.on('request', request => {
            if (request.url().includes('/api/v1/data/')) requests.push(request.url());
          });
          page.on('requestfailed', request => {
            failures.push({ url: request.url(), error: request.failure()?.errorText ?? null });
          });
          page.on('console', message => consoleMessages.push(`${message.type()}: ${message.text()}`));
          const response = await page.goto('https://www.apprepbrasil.com.br/dados', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(7000);
          const state = await page.evaluate(() => ({
            status: document.readyState,
            text: document.body.innerText.slice(0, 5000),
            selects: [...document.querySelectorAll('select')].map(select => ({
              label: select.closest('label')?.innerText ?? null,
              options: [...select.options].map(option => ({ value: option.value, text: option.textContent })),
            })),
            errors: [...document.querySelectorAll('.text-red-500')].map(node => node.textContent),
          }));
          console.log(JSON.stringify({ httpStatus: response?.status(), requests, failures, consoleMessages, state }, null, 2));
          await browser.close();
          NODE
