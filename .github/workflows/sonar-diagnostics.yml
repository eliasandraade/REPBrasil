name: Sonar diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  issues:
    if: github.event.pull_request.number == 35
    runs-on: ubuntu-latest
    steps:
      - name: Print Sonar issues for PR 35
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=eliasandraade_REPBrasil' \
            --data-urlencode 'pullRequest=35' \
            --data-urlencode 'statuses=OPEN,CONFIRMED' \
            --data-urlencode 'ps=100' \
            -o /tmp/issues.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/issues.json').read_text())
          print(f"total={payload.get('total')}")
          for issue in payload.get('issues', []):
              component = issue.get('component', '').split(':', 1)[-1]
              line = issue.get('line') or issue.get('textRange', {}).get('startLine')
              print('---')
              print(f"severity={issue.get('severity')} type={issue.get('type')} rule={issue.get('rule')}")
              print(f"file={component} line={line}")
              print(f"message={issue.get('message')}")
          PY
