name: Sonar PR diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Print remaining PR issues
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --get 'https://sonarcloud.io/api/issues/search' \
            --data-urlencode 'componentKeys=eliasandraade_REPBrasil' \
            --data-urlencode 'pullRequest=36' \
            --data-urlencode 'issueStatuses=OPEN,CONFIRMED' \
            --data-urlencode 'sinceLeakPeriod=true' \
            --data-urlencode 'ps=100' \
            -o /tmp/issues.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/issues.json').read_text())
          print(f"PR ISSUES total={data.get('total')}")
          for issue in data.get('issues', []):
              component = issue.get('component', '').split(':', 1)[-1]
              line = issue.get('line') or issue.get('textRange', {}).get('startLine')
              print('--- issue')
              print(f"severity={issue.get('severity')} type={issue.get('type')} rule={issue.get('rule')}")
              print(f"file={component} line={line}")
              print(f"message={issue.get('message')}")
          PY
