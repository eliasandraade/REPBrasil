[project]
name = "repbrasil-etl"
version = "0.1.0"
description = "Pipelines de coleta e processamento de dados públicos para o REPBrasil"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "polars>=1.0.0",
    "pydantic>=2.7,<3",
    "loguru>=0.7.0",
    "tenacity>=9.0.0",
    "psycopg2-binary>=2.9.0",
    # Inteligência eleitoral (src/electoral): psycopg 3 (COPY/transações por zona) e ASN.1 do BU.
    "psycopg[binary]>=3.2",
    "asn1tools>=0.167",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "src/models", "src/sources", "src/electoral"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Pipeline eleitoral portado do Urnaí com linhas de até 140 colunas; reformatar em massa
# não traz ganho e dificultaria a comparação linha a linha com a origem auditada.
"src/electoral/**" = ["E501"]
"tests/electoral/**" = ["E501"]
"scripts/audit_electoral_cross_db.py" = ["E501"]
"scripts/electoral_invariants.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
